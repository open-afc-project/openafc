# External cluster-specifc config for install_prerequisites.py.
# Requires YAML with externalIps (values-afc-common.yaml as of time of this
# writing) to also be included as config file

default_install_components:
  - external_secrets
  - istio_injection

install_components:
  istio_injection:
    postinstall:
      - >-
        kubectl patch namespace default {{context:kubectl}} -p '{"metadata":{"labels":{"istio-injection": "enabled"}}}'
      - >-
        kubectl patch namespace external-secrets {{context:kubectl}} -p '{"metadata":{"labels":{"istio-injection": "enabled"}}}'
    postuninstall:
      - >-
        kubectl label namespace default {{context:kubectl}} istio-injection-
