apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.name }}-webui-ratapi-env
spec:
  secretStoreRef:
    kind: SecretStore
    name: {{ .Values.secretStore.name }}  # name of the SecretStore (or kind specified)
  target:
    name: {{ .Chart.Name }}-webui-ratapi-env-secret            # name of the k8s Secret to be created
  data:
  - secretKey: ratapi-env              # name of the GCPSM secret key
    remoteRef:
      key: ratapi-env

