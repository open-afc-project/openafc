apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.name }}-postgres-user
spec:
  secretStoreRef:
    kind: SecretStore
    name: {{ .Values.secretStore.name }}  # name of the SecretStore (or kind specified)
  target:
    name: {{ .Chart.Name }}-postgres-user-secret            # name of the k8s Secret to be created
  data:
  - secretKey: postgres-user              # name of the GCPSM secret key
    remoteRef:
      key: postgres-user

