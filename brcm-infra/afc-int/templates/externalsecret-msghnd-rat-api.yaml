apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.name }}-msghnd-ratapi
spec:
  secretStoreRef:
    kind: SecretStore
    name: {{ .Values.secretStore.name }}  # name of the SecretStore (or kind specified)
  target:
    name: {{ .Chart.Name }}-msghnd-rat-api-secret           # name of the k8s Secret to be created
  data:
  - secretKey: msghnd-ratapi              # name of the GCPSM secret key
    remoteRef:
      key: msghnd-ratapi

