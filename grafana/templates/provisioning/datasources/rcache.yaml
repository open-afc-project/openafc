# Rcache rest API
apiVersion: 1

{% if GRAFANA_DS_RCACHE_URL is defined -%}
deleteDatasources:
  - name: Rcache

datasources:
  - access: proxy
    apiVersion: ''
    basicAuth: false
    basicAuthUser: ''
    database: ''
    isDefault: false
    jsonData:
      allowed_hosts:
        - '{{ GRAFANA_DS_RCACHE_URL }}'
      auth_method: none
      customHealthCheckEnabled: true
      customHealthCheckUrl: >-
        {{ GRAFANA_DS_RCACHE_URL }}/status
      global_queries: []
      oauthPassThru: false
      proxy_type: none
      # TLS verification is on by default; an operator pointing this
      # datasource at a self-signed https endpoint opts out explicitly at
      # the compose/env level (same policy as SSL_VERIFY in
      # prometheus/Dockerfile-nginxexporter).
      tlsSkipVerify: {{ GRAFANA_DS_RCACHE_TLS_SKIP_VERIFY | default('false') }}
    name: Rcache
    orgId: 1
    readOnly: false
    secureJsonFields: {}
    type: yesoreyeram-infinity-datasource
    typeLogoUrl: public/plugins/yesoreyeram-infinity-datasource/img/icon.svg
    url: >-
      {{ GRAFANA_DS_RCACHE_URL }}
    user: ''
    version: 6
    withCredentials: false
{% endif -%}
