# FS (ULS) downloader state data source
---
apiVersion: 1

{% if GRAFANA_COMPOSE_PROJECT_NAME is defined -%}
deleteDatasources:
  - name: Docker

# The 'Docker' Infinity datasource is intentionally NOT provisioned:
# allowed_hosts constrains host but not path, so any Viewer with
# datasources:query (viewers_can_edit=true) could issue arbitrary-path
# GETs to socket-proxy:2375 (e.g. /containers/{id}/json, /logs),
# defeating the monitor-net isolation socket-proxy relies on.
# deleteDatasources above removes any previously-provisioned instance.
datasources: []
{% endif %}
