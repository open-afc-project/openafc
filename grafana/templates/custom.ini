#################################### Server ####################################
[server]
# The full public facing url you use in browser, used for redirects and emails
# If you use reverse proxy and sub path specify full url (with sub path)
root_url = %(protocol)s://%(domain)s:%(http_port)s/fbrat/grafana/

# Serve Grafana from subpath specified in `root_url` setting. By default it is set to `false` for compatibility reasons.
serve_from_sub_path = true

#################################### Auth ####################################
[auth.anonymous]
# Disabled: Grafana OSS Viewer carries the datasources:query action, so an
# anonymous Viewer can POST /api/ds/query with arbitrary rawSql / Infinity url
# against the provisioned datasources. Internal containers reach grafana:3000
# directly (bypassing the nginx _super_check gate); all access must therefore
# come via auth.proxy from the whitelisted dispatcher /32 or the admin account.
enabled = false
org_role = Viewer

[auth]
disable_login_screen = false
# Disable form login so the only WAN path into Grafana is the auth.proxy
# Viewer identity asserted by nginx (see nginx.conf.template /fbrat/grafana).
disable_login_form = true

[users]
# Fallback role for users created through paths other than auth.proxy.
# auth.proxy-created users get their role from the X-WEBAUTH-ROLE header
# (configured in [auth.proxy] below), which syncs on every request and
# ensures Editor role even after a fresh-database container start.
auto_assign_org_role = Editor

# auth.proxy: nginx authenticates the Super user via auth_request, then injects
# X-WEBAUTH-USER for Grafana to trust.  The whitelist MUST be set to the
# dispatcher container's /32 IP only.  Do NOT use broad RFC-1918 ranges because
# that would allow peer containers on the Docker bridge to directly assert user
# identity without passing through the nginx authentication gate.
#
# Set GRAFANA_AUTH_PROXY_WHITELIST to the dispatcher's IP on the
# dedicated grafana-proxy network (e.g. 172.28.64.2/32).
# If the variable is not set, auth.proxy is disabled and admin access
# requires the Grafana admin password.
[auth.proxy]
{% if GRAFANA_AUTH_PROXY_WHITELIST is defined and GRAFANA_AUTH_PROXY_WHITELIST -%}
enabled = true
header_name = X-WEBAUTH-USER
header_property = username
auto_sign_up = true
whitelist = {{ GRAFANA_AUTH_PROXY_WHITELIST }}
# Accept a role header from nginx so afc_super is always Editor, even after
# a fresh-database container start.  sync_ttl=0 re-reads headers on every
# request, keeping the org role in sync without a manual DB update.
headers = Role:X-WEBAUTH-ROLE
sync_ttl = 0
{%- else -%}
enabled = false
{%- endif %}

{% if GRAFANA_DATABASE_URL is defined -%}
[database]
type = postgres
host = {{ GRAFANA_DATABASE_URL | dsn_parse("hostname") }}:{{ GRAFANA_DATABASE_URL | dsn_parse("port") | default("5432") }}
name = {{ GRAFANA_DATABASE_URL | dsn_parse("path") | trim("/") }}
user = {{ GRAFANA_DATABASE_URL | dsn_parse("username") }}
  {%- if GRAFANA_DATABASE_PASSWORD_FILE is defined %}
password = $__file{ {{- GRAFANA_DATABASE_PASSWORD_FILE -}} }
  {%- else %}
password = {{ GRAFANA_DATABASE_URL | dsn_parse("password") | default("") }}
  {%- endif %}
{% endif -%}

# Grafana 11.6.11+ is required for grafana-lokiexplore-app 1.0.38+ (Drilldown > Logs).
# Explore (/explore): pick datasource "Loki" (uid afc-loki) in the top bar if it opens on Prometheus.
