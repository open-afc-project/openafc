# Keep the built-in guest account restricted to loopback only (RabbitMQ default).
# The guest account is explicitly deleted in docker-entrypoint-shim.sh via
# rabbitmqctl after node startup.  The loopback_users default is an additional
# in-depth guard; do NOT set it to false.
loopback_users.guest = true
listeners.tcp.default = 5672
management.tcp.port = 15672
#
management.load_definitions = /etc/rabbitmq/definitions.json
management.path_prefix = /fbrat/rabbitmq
# RabbitMQ 4.x: transient non-exclusive queues are disabled by default.
# Celery (via kombu) uses transient non-durable queues for pidbox (control messages).
# Permit this deprecated feature until Celery/kombu migrates to durable queues
# (targeted in kombu 5.7.0). Remove this setting once kombu >= 5.7.0 is in use.
deprecated_features.permit.transient_nonexcl_queues = true
# RabbitMQ 4.x: global QoS (basic.qos with global=true) is deprecated.
# Celery uses global QoS when worker_prefetch_multiplier=1 and task_acks_late=True.
# This is a kombu bug fixed in kombu 5.7.0 (qos_semantics_matches_spec returns True for
# RabbitMQ >= 4.0, switching to per-consumer QoS). Until kombu 5.7.0 is available on
# PyPI, permit this feature to avoid log spam. Remove once kombu >= 5.7.0 is deployed.
deprecated_features.permit.global_qos = true
# RabbitMQ 4.x: management_metrics_collection is deprecated (resource-intensive per-message
# metrics in the management plugin). Permit it to suppress log warnings until we migrate
# to using the Prometheus plugin exclusively for metrics. Remove once metrics consumers
# (nginx-exporter, Grafana) are confirmed to work without it.
deprecated_features.permit.management_metrics_collection = true
# Log level is appended by the Dockerfile RUN step using $RMQ_LOG_CONSOLE_LEVEL.
