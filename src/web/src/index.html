<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title><%= htmlWebpackPlugin.options.title %></title>
    <meta id="appName" name="application-name" content="AFC" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="images/favicon.ico" />
  </head>

  <body>
    <noscript>Enabling JavaScript is required to run this app.</noscript>
    <script>
      (function(){var t=localStorage.getItem('pf-theme');if(t==='dark'||(t===null&&window.matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('pf-v6-theme-dark');})();
    </script>
    <div id="root"></div>
  </body>
</html>
