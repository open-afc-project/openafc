apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.name }}-server-cert-pem
spec:
  secretStoreRef:
    kind: SecretStore
    name: {{ .Values.secretStore.name }}  # name of the SecretStore (or kind specified)
  target:
    name: dispatcher-server-cert-secret   # name of the k8s Secret to be created
  data:
  - secretKey: server-cert-pem            # name of the GCPSM secret key
    remoteRef:
      key: server-cert-pem

