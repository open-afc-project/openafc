apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.name }}-server-key-pem
spec:
  secretStoreRef:
    kind: SecretStore
    name: {{ .Values.secretStore.name }}  # name of the SecretStore (or kind specified)
  target:
    name: {{ .Chart.Name }}-dispatcher-server-key-secret    # name of the k8s Secret to be created
  data:
  - secretKey: server-key-pem             # name of the GCPSM secret key
    remoteRef:
      key: server-key-pem

