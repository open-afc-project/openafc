# check .env file for env vars info and values

version: '3.2'
services:
  ratdb:
    image: wcc-afc-docker-virtual.usw2.packages.broadcom.com/ratdb-image:${TAG:-latest}
    restart: always
    volumes:
      - ./pgdata:/var/lib/pgsql/data
    environment:
      POSTGRES_PASSWORD: N3SF0LVKJx1RAhFGx4fcw
      PGDATA: /var/lib/pgsql/data
      POSTGRES_DB: fbrat
    dns_search: [.]

  rmq:
    image: wcc-afc-docker-virtual.usw2.packages.broadcom.com/rmq-image:${TAG:-latest}
    restart: always
    dns_search: [.]

  dispatcher:
    image: wcc-afc-docker-virtual.usw2.packages.broadcom.com/dispatcher-image:${TAG:-latest}
    restart: always
    ports:
      - "${EXT_PORT}:80"
      - "${EXT_PORT_S}:443"
    volumes:
      - ${VOL_H_NGNX:-/tmp}:${VOL_C_NGNX:-/dummyngnx}
    environment:
      - AFC_ENFORCE_HTTPS=${AFC_ENFORCE_HTTPS:-TRUE}
      - AFC_ENFORCE_MTLS=true
      - AFC_MSGHND_NAME=msghnd
      - AFC_MSGHND_PORT=8000
      - AFC_WEBUI_NAME=rat_server
      - AFC_WEBUI_PORT=80
      # Filestorage params:
      - AFC_OBJST_HOST=objst
      - AFC_OBJST_PORT=5000
      - AFC_OBJST_SCHEME=HTTP
      # proxy timeout
      - AFC_PROXY_CONN_TOUT=${AFC_PROXY_CONN_TOUT}
    depends_on:
      - msghnd
      - rat_server
    dns_search: [.]

  rat_server:
    image: wcc-afc-docker-virtual.usw2.packages.broadcom.com/afc-server:${BRCM_TAG-latest}
    volumes:
      - ${VOL_H_DB}:${VOL_C_DB}
      - ./OIDC:/OIDC
    depends_on:
      - ratdb
      - rmq
      - objst
      - als_kafka
      - als_siphon
      - bulk_postgres
      - rcache
        #secrets:
        #- NOTIFIER_MAIL.json
        #- OIDC.json
        #- REGISTRATION.json
        #- REGISTRATION_CAPTCHA.json
    dns_search: [.]
    environment:
      # RabbitMQ server name:
      - BROKER_TYPE=external
      - BROKER_FQDN=rmq
      # Filestorage params:
      - AFC_OBJST_HOST=objst
      - AFC_OBJST_PORT=5000
      - AFC_OBJST_SCHEME=HTTP
      # worker params
      - CELERY_TYPE=external
      # ALS params
      - ALS_KAFKA_SERVER_ID=rat_server
      - ALS_KAFKA_CLIENT_BOOTSTRAP_SERVERS=${ALS_KAFKA_SERVER_}:${ALS_KAFKA_CLIENT_PORT_}
      - ALS_KAFKA_MAX_REQUEST_SIZE=${ALS_KAFKA_MAX_REQUEST_SIZE_}  
      # Rcache parameters
      - RCACHE_ENABLED=${RCACHE_ENABLED}
      - RCACHE_POSTGRES_DSN=postgresql://postgres:postgres@bulk_postgres/rcache
      - RCACHE_SERVICE_URL=http://rcache:${RCACHE_PORT}
      - RCACHE_RMQ_DSN=amqp://rcache:rcache@rmq:5672/rcache
      # OIDC and Captcha
      - OIDC_ARG=/OIDC/oidc_env.cfg
      - RATAPI_ARG=/OIDC/ratapi_env.cfg
      # TIMEOUT
      - AFC_MSGHND_RATAFC_TOUT=${AFC_MSGHND_RATAFC_TOUT}

  msghnd:
    image: wcc-afc-docker-virtual.usw2.packages.broadcom.com/afc-msghnd:${TAG:-latest}
    environment:
      # RabbitMQ server name:
      - BROKER_TYPE=external
      - BROKER_FQDN=rmq
      # Filestorage params:
      - AFC_OBJST_HOST=objst
      - AFC_OBJST_PORT=5000
      - AFC_OBJST_SCHEME=HTTP
      # ALS params
      - ALS_KAFKA_SERVER_ID=msghnd
      - ALS_KAFKA_CLIENT_BOOTSTRAP_SERVERS=${ALS_KAFKA_SERVER_}:${ALS_KAFKA_CLIENT_PORT_}
      # Rcache parameters
      - RCACHE_ENABLED=${RCACHE_ENABLED}
      - RCACHE_POSTGRES_DSN=postgresql://postgres:postgres@bulk_postgres/rcache
      - RCACHE_SERVICE_URL=http://rcache:${RCACHE_PORT}
      - RCACHE_RMQ_DSN=amqp://rcache:rcache@rmq:5672/rcache
      # TIMEOUT
      - AFC_MSGHND_RATAFC_TOUT=${AFC_MSGHND_RATAFC_TOUT}
      - AFC_MSGHND_TIMEOUT=${AFC_MSGHND_TIMEOUT}

    dns_search: [.]
    depends_on:
      - ratdb
      - rmq
      - objst
      - als_kafka
      - als_siphon
      - bulk_postgres
      - rcache

  objst:
    image: wcc-afc-docker-virtual.usw2.packages.broadcom.com/objstorage-image:${TAG:-latest}
    environment:
      - AFC_OBJST_PORT=5000
      - AFC_OBJST_HIST_PORT=4999
      - AFC_OBJST_LOCAL_DIR=/storage
    volumes:
      - ./storage:/storage
    dns_search: [.]

  worker:
    image: wcc-afc-docker-virtual.usw2.packages.broadcom.com/afc-worker:${TAG:-latest}
    volumes:
      - ${VOL_H_DB}:${VOL_C_DB}
    environment:
      # Filestorage params:
      - AFC_OBJST_HOST=objst
      - AFC_OBJST_PORT=5000
      - AFC_OBJST_SCHEME=HTTP
      # worker params
      - AFC_WORKER_CELERY_OPTS=rat_1 rat_2
      # RabbitMQ server name:
      - BROKER_TYPE=external
      - BROKER_FQDN=rmq
      # afc-engine preload lib params
      - AFC_AEP_ENABLE=1
      - AFC_AEP_DEBUG=1
      - AFC_AEP_REAL_MOUNTPOINT=${VOL_C_DB}/3dep/1_arcsec
      # Rcache parameters
      - RCACHE_ENABLED=${RCACHE_ENABLED}
      - RCACHE_SERVICE_URL=http://rcache:${RCACHE_PORT}
      - RCACHE_RMQ_DSN=amqp://rcache:rcache@rmq:5672/rcache
      - RCACHE_UPDATE_ON_SEND=${RCACHE_UPDATE_ON_SEND}
      # TIMEOUT
      - AFC_WORKER_ENG_TOUT=${AFC_WORKER_ENG_TOUT}
    depends_on:
      - ratdb
      - rmq
      - objst
      - rcache
    dns_search: [.]

  als_kafka:
    image: wcc-afc-docker-virtual.usw2.packages.broadcom.com/als-kafka-image:${TAG:-latest}
    restart: always
    environment:
      - KAFKA_ADVERTISED_HOST=${ALS_KAFKA_SERVER_}
      - KAFKA_CLIENT_PORT=${ALS_KAFKA_CLIENT_PORT_}
    dns_search: [.]

  als_siphon:
    image: wcc-afc-docker-virtual.usw2.packages.broadcom.com/als-siphon-image:${TAG:-latest}
    restart: always
    environment:
      - KAFKA_SERVERS=${ALS_KAFKA_SERVER_}:${ALS_KAFKA_CLIENT_PORT_}
      - POSTGRES_HOST=bulk_postgres
      - INIT_IF_EXISTS=skip
      - KAFKA_MAX_REQUEST_SIZE=${ALS_KAFKA_MAX_REQUEST_SIZE_}
    depends_on:
      - als_kafka
      - bulk_postgres
    dns_search: [.]

  bulk_postgres:
    image: wcc-afc-docker-virtual.usw2.packages.broadcom.com/bulk-postgres-image:${TAG:-latest}
    volumes:
      - ./bulk_pgdata:/var/lib/postgresql/data
    dns_search: [.]

  uls_downloader:
    image: wcc-afc-docker-virtual.usw2.packages.broadcom.com/uls-downloader:${TAG:-latest}
    restart: always
    environment:
      - ULS_AFC_URL=http://msghnd:8000/fbrat/ap-afc/availableSpectrumInquiryInternal?nocache=True
      - ULS_DELAY_HR=1
      # Rcache parameters
      - RCACHE_ENABLED=${RCACHE_ENABLED}
      - RCACHE_SERVICE_URL=http://rcache:${RCACHE_PORT}
      - ULS_ALARM_SMTP_INFO=/run/secrets/NOTIFIER_MAIL.json
      - ULS_ALARM_EMAIL_TO=wcc-afc-swdev.pdl@broadcom.com
      - ULS_ALARM_ALARM_INTERVAL_HR=0
      - ULS_ALARM_SUCCESS_MAX_AGE_HR=9
      - ULS_ALARM_BEACON_INTERVAL_HR=0

    volumes:
      - ${VOL_H_DB}:/rat_transfer
      - uls_downloader_state:/uls_downloader_state
    secrets:
      - NOTIFIER_MAIL.json
    dns_search: [.]

  cert_db:
    image: wcc-afc-docker-virtual.usw2.packages.broadcom.com/cert_db:${TAG:-latest}
    depends_on:
      - ratdb
    links:
      - ratdb
      - als_kafka
    environment:
      - ALS_KAFKA_SERVER_ID=cert_db
      - ALS_KAFKA_CLIENT_BOOTSTRAP_SERVERS=${ALS_KAFKA_SERVER_}:${ALS_KAFKA_CLIENT_PORT_}

  rcache:
    image: wcc-afc-docker-virtual.usw2.packages.broadcom.com/rcache-image:${TAG:-latest}
    restart: always
    environment:
      - RCACHE_ENABLED=${RCACHE_ENABLED}
      - RCACHE_PORT=${RCACHE_PORT}
      - RCACHE_POSTGRES_DSN=postgresql://postgres:postgres@bulk_postgres/rcache
      - RCACHE_AFC_REQ_URL=http://msghnd:8000/fbrat/ap-afc/availableSpectrumInquiry?nocache=True
      - RCACHE_RULESETS_URL=http://rat_server/fbrat/ratapi/v1/GetRulesetIDs
      - RCACHE_CONFIG_RETRIEVAL_URL=http://rat_server/fbrat/ratapi/v1/GetAfcConfigByRulesetID
    depends_on:
      - bulk_postgres
    dns_search: [.]

volumes:
  uls_downloader_state:

secrets:
    NOTIFIER_MAIL.json:
        file: ${VOL_H_SECRETS}/NOTIFIER_MAIL.json
    OIDC.json:
        file: ${VOL_H_SECRETS}/OIDC.json
    REGISTRATION.json:
        file: ${VOL_H_SECRETS}/REGISTRATION.json
    REGISTRATION_CAPTCHA.json:
        file: ${VOL_H_SECRETS}/REGISTRATION_CAPTCHA.json
